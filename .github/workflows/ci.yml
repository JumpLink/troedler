name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Node-free gjsify toolchain (mirrors postbote/bauplaner). Everything runs on the gjsify stack
# pinned in app/package.json: `gjsify install --immutable` (from gjsify-lock.json), the bundled
# `gjsify tsc` type-check, `gjsify build` for the CLI bundle, and the test bundle under both gjs
# and node. Node is present only to bootstrap the gjsify CLI (its published bin is Node; its work
# targets gjs).
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      # libgda-sqlite backs `node:sqlite` under GJS — without it the store cannot open a database
      # and every test that touches saved searches fails at module load, not at the assertion.
      # Unlike postbote there are no GOA/EDS typelibs here: troedler speaks HTTP, not D-Bus.
      - name: Install system prerequisites (gjs + libgda)
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git tar xz findutils gjs
          libgda libgda-sqlite

      - uses: actions/checkout@v4

      # Node 24 to bootstrap + run the gjsify CLI. gjsify's native install-backend prebuilds
      # target node 24 — Fedora's default node 22 loads a mismatched ABI and segfaults
      # `gjsify install`.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Content-addressed tarball store: a warm cache lets `gjsify install --immutable` skip the
      # download phase. Keyed on the lockfile.
      - name: Cache gjsify tarball store
        uses: actions/cache@v4
        with:
          path: ~/.cache/gjsify/tarballs
          key: gjsify-tarballs-${{ hashFiles('gjsify-lock.json') }}
          restore-keys: gjsify-tarballs-

      # Bootstrap the gjsify CLI so `gjsify install` is runnable before node_modules exists. It
      # must be the SAME version the deps pin — a global-CLI ↔ pinned-libs mismatch produces
      # broken bundles. Read that version out of app/package.json rather than repeating it:
      # hardcoded, it silently fell behind in a sibling project when the pin moved.
      - name: Bootstrap the gjsify CLI
        run: |
          VERSION=$(node -p "require('./app/package.json').devDependencies['@gjsify/cli']")
          echo "Bootstrapping @gjsify/cli@$VERSION (from app/package.json)"
          npm install -g "@gjsify/cli@$VERSION"

      - name: Install dependencies (gjsify install --immutable)
        run: gjsify install --immutable

      # -A includes `private: true` workspaces. Without it every packages/* is skipped and the
      # type-check silently covers only the app.
      - name: Type check (app + every package)
        run: gjsify foreach -A check

      - name: Lint
        run: gjsify foreach -A lint

      - name: Format check
        run: gjsify workspace troedler-cli format:check

      # Also a grep, and for a reason no test can cover: a test proves a kernel
      # function WORKS, never that anything USES it. `groupByIdentity` and
      # `bestOf` — the cross-source grouping this project exists for — had a
      # green test each and no caller at all.
      - name: Guard against unreachable kernel functions
        run: node scripts/guard-unused-kernel.mjs

      # Also a grep, and for the same reason. `apiHost: true` and
      # `access: 'official-api'` are two spellings of one fact in two files, and
      # `troedler robots` can only reach the second one. When they drifted the
      # command described a different program: it printed "VERBOTEN" for the URL
      # every Booklooker search fetches.
      - name: Guard the apiHost ⟺ access correspondence
        run: node scripts/guard-api-hosts.mjs

      # The capability probe that travels with every gjsify bump, as a committed
      # file so the NEXT person can re-run it instead of re-deriving it from a
      # release note. It gates on BOTH runtimes because every gap it covers bit
      # on GJS while Node stayed green — a green node run proves nothing here.
      #
      # It also earns its keep by being able to go red: at the 0.53.0 bump it
      # printed 21 green / 3 red on 0.52.0 and 24 / 0 on 0.53.0, and the three were
      # a real finding (an INTEGER above 2^31 was refused outright, and
      # `price_minor` is an INTEGER column). Do not "simplify" a check away
      # because it has been green for a while.
      - name: Capability probe (gjs)
        run: |
          gjsify build scripts/probe-gjsify-0.53.mjs --app gjs --outfile app/dist/probe.gjs.mjs
          gjsify run app/dist/probe.gjs.mjs

      - name: Capability probe (node)
        run: node scripts/probe-gjsify-0.53.mjs

      # `guard-url-setters.mjs` used to live here and was deleted WHOLE at the
      # 0.52.0 bump: all ten WHATWG setters measure green under gjs now, so the
      # file had nothing left to refuse. Its ancestor was deleted the same way at
      # 0.42.0 — but that time only five of the ten were green, which is how the
      # other nine spent five releases unguarded. The rule that survives both
      # deletions: re-measure at every bump and delete the file only when the
      # measurement has no red line left, not when one of them turned.

      # Also a lookup, and for the same reason: an icon name the icon theme does
      # not have type-checks, compiles, runs, and renders as an EMPTY WHITE
      # RECTANGLE on a Gtk.MenuButton rather than as a missing-image placeholder.
      # Nothing else in this pipeline could see that — only a screenshot did. The
      # check also proves the app's own bundled icon resource still matches its
      # SVG, using nothing but Node.
      - name: Guard against icon names the theme cannot draw
        run: node scripts/guard-icon-names.mjs

      # A `.blp` template's `$Name` and the `GTypeName` registering it are ONE
      # string. A rename on one side only makes GJS refuse to build the template,
      # `super()` throw, and the window come up with no search view in it — an
      # empty frame where the whole app is. It type-checked, linted, built, passed
      # 1487 assertions on both runtimes and went green in CI first; only a
      # screenshot showed it.
      - name: Guard against a template and its GTypeName drifting apart
        run: node scripts/guard-template-types.mjs

      # Both bundles. The GUI is a separate entry point because `import Adw`
      # becomes a top-level `gi://Adw` — building it here is what keeps that
      # split from rotting, since nothing else in CI imports a widget.
      - name: Build the CLI and the app bundle
        run: gjsify workspace troedler-cli build

      # Runs on gjs AND node. No network here, and that is deliberate: every provider test works
      # against fixtures through the pure parse layer. A test that needed a marketplace to be
      # reachable would be a test that fails for reasons that are not our bugs.
      #
      # TWICE, in two timezones, and that is not belt-and-braces. Every source in this project
      # prints German wall-clock time — "Heute, 17:08" — and reading those numbers with
      # `new Date(...)` interprets them where the READER stands. That code passes on a Berlin
      # laptop and is wrong everywhere else, so a single-zone run agrees with the bug for
      # whoever wrote it. One of these two legs always disagrees.
      - name: Tests (gjs + node, Europe/Berlin)
        env:
          TZ: Europe/Berlin
        run: gjsify workspace troedler-cli test

      - name: Tests (gjs + node, Pacific/Auckland)
        env:
          TZ: Pacific/Auckland
        run: gjsify workspace troedler-cli test

      # Two phases: the default catalogue must be read-only tools only, and the write-enabled
      # catalogue must be strictly larger. The gate fails CLOSED, so a tool that forgot its
      # annotation goes missing rather than becoming silently reachable — this is what notices.
      - name: MCP smoke test (stdio, both catalogues)
        run: node app/tests/integration/mcp-gjs-smoke.mjs
