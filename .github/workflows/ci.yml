name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Also callable, so a tag's release runs this exact job instead of a second copy of it that has
  # to be kept in step with this one. Nothing here needs a secret, so a caller forwards none.
  workflow_call:

# Node-free gjsify toolchain (mirrors postbote/bauplaner). Everything runs on the gjsify stack
# pinned in app/package.json: `gjsify install --immutable` (from gjsify-lock.json), the bundled
# `gjsify tsc` type-check, `gjsify build` for the CLI bundle, and the test bundle under both gjs
# and node. Node is present only to bootstrap the gjsify CLI (its published bin is Node; its work
# targets gjs).
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      # libgda-sqlite backs `node:sqlite` under GJS — without it the store cannot open a database
      # and every test that touches saved searches fails at module load, not at the assertion.
      # Unlike postbote there are no GOA/EDS typelibs here: troedler speaks HTTP, not D-Bus.
      # msitools adds `wixl`, the Linux-side MSI compiler `gjsify ship windows --target msi`
      # needs (ADR 0024 § M5 in gjsify): a Fedora package, not a download like appimagetool.
      - name: Install system prerequisites (gjs + libgda)
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git tar xz findutils gjs
          libgda libgda-sqlite msitools

      - uses: actions/checkout@v4

      # Node 24 to bootstrap + run the gjsify CLI. gjsify's native install-backend prebuilds
      # target node 24 — Fedora's default node 22 loads a mismatched ABI and segfaults
      # `gjsify install`.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Content-addressed tarball store: a warm cache lets `gjsify install --immutable` skip the
      # download phase. Keyed on the lockfile.
      - name: Cache gjsify tarball store
        uses: actions/cache@v4
        with:
          path: ~/.cache/gjsify/tarballs
          key: gjsify-tarballs-${{ hashFiles('gjsify-lock.json') }}
          restore-keys: gjsify-tarballs-

      # Bootstrap the gjsify CLI so `gjsify install` is runnable before node_modules exists. It
      # must be the SAME version the deps pin — a global-CLI ↔ pinned-libs mismatch produces
      # broken bundles. Read that version out of app/package.json rather than repeating it:
      # hardcoded, it silently fell behind in a sibling project when the pin moved.
      - name: Bootstrap the gjsify CLI
        run: |
          VERSION=$(node -p "require('./app/package.json').devDependencies['@gjsify/cli']")
          echo "Bootstrapping @gjsify/cli@$VERSION (from app/package.json)"
          npm install -g "@gjsify/cli@$VERSION"

      - name: Install dependencies (gjsify install --immutable)
        run: gjsify install --immutable

      # -A includes `private: true` workspaces. Without it every packages/* is skipped and the
      # type-check silently covers only the app.
      - name: Type check (app + every package)
        run: gjsify foreach -A check

      - name: Lint
        run: gjsify foreach -A lint

      - name: Format check
        run: gjsify workspace troedler-cli format:check

      # Also a grep, and for a reason no test can cover: a test proves a kernel
      # function WORKS, never that anything USES it. `groupByIdentity` and
      # `bestOf` — the cross-source grouping this project exists for — had a
      # green test each and no caller at all.
      - name: Guard against unreachable kernel functions
        run: node scripts/guard-unused-kernel.mjs

      # Also a grep, and for the same reason. `apiHost: true` and
      # `access: 'official-api'` are two spellings of one fact in two files, and
      # `troedler robots` can only reach the second one. When they drifted the
      # command described a different program: it printed "VERBOTEN" for the URL
      # every Booklooker search fetches.
      - name: Guard the apiHost ⟺ access correspondence
        run: node scripts/guard-api-hosts.mjs

      # The capability probe that travels with every gjsify bump, as a committed
      # file so the NEXT person can re-run it instead of re-deriving it from a
      # release note. It gates on BOTH runtimes because every gap it covers bit
      # on GJS while Node stayed green — a green node run proves nothing here.
      #
      # It also earns its keep by being able to go red: at the 0.53.0 bump it
      # printed 21 green / 3 red on 0.52.0 and 24 / 0 on 0.53.0, and the three were
      # a real finding (an INTEGER above 2^31 was refused outright, and
      # `price_minor` is an INTEGER column). Do not "simplify" a check away
      # because it has been green for a while.
      - name: Capability probe (gjs)
        run: |
          gjsify build scripts/probe-gjsify-0.53.mjs --app gjs --outfile app/dist/probe.gjs.mjs
          gjsify run app/dist/probe.gjs.mjs

      - name: Capability probe (node)
        run: node scripts/probe-gjsify-0.53.mjs

      # `guard-url-setters.mjs` used to live here and was deleted WHOLE at the
      # 0.52.0 bump: all ten WHATWG setters measure green under gjs now, so the
      # file had nothing left to refuse. Its ancestor was deleted the same way at
      # 0.42.0 — but that time only five of the ten were green, which is how the
      # other nine spent five releases unguarded. The rule that survives both
      # deletions: re-measure at every bump and delete the file only when the
      # measurement has no red line left, not when one of them turned.

      # Also a lookup, and for the same reason: an icon name the icon theme does
      # not have type-checks, compiles, runs, and renders as an EMPTY WHITE
      # RECTANGLE on a Gtk.MenuButton rather than as a missing-image placeholder.
      # Nothing else in this pipeline could see that — only a screenshot did. The
      # check also proves the app's own bundled icon resource still matches its
      # SVG, using nothing but Node.
      - name: Guard against icon names the theme cannot draw
        run: node scripts/guard-icon-names.mjs

      # A `.blp` template's `$Name` and the `GTypeName` registering it are ONE
      # string. A rename on one side only makes GJS refuse to build the template,
      # `super()` throw, and the window come up with no search view in it — an
      # empty frame where the whole app is. It type-checked, linted, built, passed
      # 1487 assertions on both runtimes and went green in CI first; only a
      # screenshot showed it.
      - name: Guard against a template and its GTypeName drifting apart
        run: node scripts/guard-template-types.mjs

      # Both bundles. The GUI is a separate entry point because `import Adw`
      # becomes a top-level `gi://Adw` — building it here is what keeps that
      # split from rotting, since nothing else in CI imports a widget.
      - name: Build the CLI and the app bundle
        run: gjsify workspace troedler-cli build

      # The `--app node` bundle darwin and win32 ship below — neither host has a GJS runtime
      # (`app/package.json#gjsify.ship.app`). Built once: `gjsify install --os/--cpu` further
      # down only swaps which platform's `@gjsify/node-gi` native addon `ship` copies in, which
      # it reads from node_modules at pack time, not from this bundle — so it is not rebuilt
      # per target.
      - name: Build the node bundle (for macOS + Windows packaging)
        run: gjsify workspace troedler-cli build:node

      # Runs on gjs AND node. No network here, and that is deliberate: every provider test works
      # against fixtures through the pure parse layer. A test that needed a marketplace to be
      # reachable would be a test that fails for reasons that are not our bugs.
      #
      # TWICE, in two timezones, and that is not belt-and-braces. Every source in this project
      # prints German wall-clock time — "Heute, 17:08" — and reading those numbers with
      # `new Date(...)` interprets them where the READER stands. That code passes on a Berlin
      # laptop and is wrong everywhere else, so a single-zone run agrees with the bug for
      # whoever wrote it. One of these two legs always disagrees.
      - name: Tests (gjs + node, Europe/Berlin)
        env:
          TZ: Europe/Berlin
        run: gjsify workspace troedler-cli test

      - name: Tests (gjs + node, Pacific/Auckland)
        env:
          TZ: Pacific/Auckland
        run: gjsify workspace troedler-cli test

      # Two phases: the default catalogue must be read-only tools only, and the write-enabled
      # catalogue must be strictly larger. The gate fails CLOSED, so a tool that forgot its
      # annotation goes missing rather than becoming silently reachable — this is what notices.
      - name: MCP smoke test (stdio, both catalogues)
        run: node app/tests/integration/mcp-gjs-smoke.mjs

      # The CLI's own installable artifacts, out of the same bundle the tests above ran against.
      # `.deb` and `.rpm` only here, and that is not a half-measure: gjsify writes both itself and
      # execs nothing for them, so this step needs no tool this job does not already install —
      # `utils/ship/formats.ts` marks the two rows `requiredTools: []`, against the Flatpak's
      # `['flatpak-builder', 'flatpak']`. The Flatpak is the separate job below, which needs both
      # of those and a privileged container. AppImage is left out on purpose: `kind: "cli"` ships
      # no desktop entry to double-click, apt/dnf already cover the terminal install this binary
      # is for, and an MCP server is invoked from an agent config, never from a file manager.
      - name: Package the CLI (.deb + .rpm)
        working-directory: app
        run: gjsify ship linux --skip-build --target deb,rpm

      # `ship` exits 0 after writing NOTHING when every target is filtered away, so each file is
      # asserted by name rather than assumed. `all`/`noarch`, not an architecture: `kind: "cli"`
      # over a JS bundle and a launcher is architecture-independent, and apt/dnf both refuse a
      # package whose architecture is not the machine's.
      - name: Assert the two packages arrived
        working-directory: app/ship/out
        run: |
          set -eu
          ls -la
          version=$(node -p "require('$GITHUB_WORKSPACE/app/package.json').version")
          for f in "troedler_${version}-1_all.deb" "troedler-${version}-1.noarch.rpm"; do
            if [ ! -s "$f" ]; then
              echo "::error::missing or empty artifact: $f"
              exit 1
            fi
          done

      # macOS and Windows runtimes are `optionalDependencies` gated by os/cpu
      # (`@gjsify/node-runtime-{darwin-arm64,darwin-x64,win32-x64}`), which a plain install on
      # this Linux host SKIPS — naming the target installs it instead, and `ship` picks up both
      # that runtime and the matching `@gjsify/node-gi` native addon from node_modules at pack
      # time. Assembly is not host-bound (ADR 0024 § A1): a Mac or Windows runner would be for
      # VERIFYING the Mach-O/PE payload, not for assembling one.
      - name: Package macOS (arm64)
        run: gjsify install --os darwin --cpu arm64 --immutable

      - name: Ship macOS (arm64)
        working-directory: app
        run: gjsify ship darwin --arch arm64 --skip-build --target macos-app-zip

      - name: Package macOS (x64)
        run: gjsify install --os darwin --cpu x64 --immutable

      - name: Ship macOS (x64)
        working-directory: app
        run: gjsify ship darwin --arch x64 --skip-build --target macos-app-zip

      # `msi` needs `wixl` (msitools, installed above); `windows-dir-zip` needs nothing `ship`
      # does not write itself.
      - name: Package Windows (x64)
        run: gjsify install --os win32 --cpu x64 --immutable

      - name: Ship Windows (x64)
        working-directory: app
        run: gjsify ship windows --arch x64 --skip-build --target windows-dir-zip,msi

      - name: Assert the macOS and Windows artifacts arrived
        working-directory: app/ship/out
        run: |
          set -eu
          ls -la
          version=$(node -p "require('$GITHUB_WORKSPACE/app/package.json').version")
          for f in \
            "troedler-${version}-1.macos.arm64.zip" \
            "troedler-${version}-1.macos.x86_64.zip" \
            "troedler-${version}-1.windows.x64.zip" \
            "troedler-${version}-1.x64.msi"; do
            if [ ! -s "$f" ]; then
              echo "::error::missing or empty artifact: $f"
              exit 1
            fi
          done

      # Both formats in ONE upload under one name: `release.yml` downloads artifacts by name, and
      # two uploads of the same artifact name is an error, not a merge.
      - uses: actions/upload-artifact@v4
        with:
          name: ship-deb-rpm
          path: |
            app/ship/out/*.deb
            app/ship/out/*.rpm
          # Already-compressed packages; the default level 6 would spend minutes
          # re-compressing them on the way up and again on the way down for no gain.
          compression-level: 0

      # `ship-*`, matching `ship-deb-rpm` and `ship-flatpak`, so release.yml's artifact download
      # with `pattern: ship-*` picks this up with no change to that step.
      - uses: actions/upload-artifact@v4
        with:
          name: ship-macos-windows
          path: |
            app/ship/out/*.zip
            app/ship/out/*.msi
          compression-level: 0

  # The Flatpak half of `gjsify ship`, split out for two reasons the job above must not inherit.
  #
  # flatpak-builder is one: gjsify writes `.deb` and `.rpm` itself and EXECS nothing, but a
  # Flatpak is an OSTree static delta and `flatpak build-bundle` is the only thing that writes
  # one — `utils/ship/formats.ts` declares `['flatpak-builder', 'flatpak']` as its required
  # tools, against `[]` for the two packages above.
  #
  # PRIVILEGE is the other: flatpak-builder runs every module's `build-commands` under `bwrap`,
  # which a `fedora:44` container without `options: --privileged` refuses
  # ("Can't mount proc on /proc: Permission denied") — see beifahrer's ci.yml for the measured
  # probe this is copied from.
  ship-flatpak:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
      options: --privileged
    steps:
      # The same gjs/libgda prerequisite as the job above — this job builds the bundle the
      # payload carries — plus the two flatpak tools. A `.flatpak` needs no GUI stack: `kind:
      # "cli"` stages no desktop entry, and `gjsify.ship.flatpak.finishArgs` here is
      # `--share=network` alone (the marketplace HTTP calls every provider makes).
      - name: Install system prerequisites
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git tar xz findutils gjs
          libgda libgda-sqlite flatpak flatpak-builder

      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache gjsify tarball store
        uses: actions/cache@v4
        with:
          path: ~/.cache/gjsify/tarballs
          key: gjsify-tarballs-${{ hashFiles('gjsify-lock.json') }}
          restore-keys: gjsify-tarballs-

      # Read out of `app/package.json`, never repeated here — the same rule as the bootstrap
      # below. `gjsify.ship.flatpak.runtimeVersion` when the project sets one, else gjsify's
      # `DEFAULT_GNOME_RUNTIME_VERSION`. Hard-coding a number here instead would make a bump fail
      # as "runtime not installed" in the middle of a build rather than at the line that has to
      # change.
      - name: Resolve the runtime version
        id: runtime
        run: |
          set -eu
          version=$(node -p "require('./app/package.json').gjsify.ship?.flatpak?.runtimeVersion ?? 50")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building the Flatpak against org.gnome.Platform//$version + org.gnome.Sdk//$version"

      - name: Cache the flatpak runtimes
        uses: actions/cache@v4
        with:
          path: /var/lib/flatpak
          key: flatpak-gnome-${{ steps.runtime.outputs.version }}-f44

      # `--system`, because that is the installation `flatpak-builder` reads when gjsify invokes
      # it (it passes no `--user`).
      - name: Install the GNOME runtime and SDK
        run: |
          set -eu
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak remote-modify --enable flathub
          flatpak install --system --noninteractive \
            "org.gnome.Platform//${{ steps.runtime.outputs.version }}" \
            "org.gnome.Sdk//${{ steps.runtime.outputs.version }}"
          flatpak list --runtime --columns=ref | grep "^org.gnome.\(Platform\|Sdk\)/"

      - name: Bootstrap the gjsify CLI
        run: |
          VERSION=$(node -p "require('./app/package.json').devDependencies['@gjsify/cli']")
          echo "Bootstrapping @gjsify/cli@$VERSION (from app/package.json)"
          npm install -g "@gjsify/cli@$VERSION"

      - name: Install dependencies (gjsify install --immutable)
        run: gjsify install --immutable

      - name: Build the CLI bundle
        run: gjsify workspace troedler-cli build

      - name: Package the CLI (.flatpak)
        working-directory: app
        run: gjsify ship linux --skip-build --target flatpak

      # Same reason as the `.deb`/`.rpm` assert: `ship` writes nothing and still exits 0 when the
      # target is filtered away, and a Flatpak is the format where a filtered-away target is
      # easiest to miss — the build prints nothing that looks like a bundle.
      - name: Assert the bundle arrived
        working-directory: app/ship/out
        run: |
          set -eu
          ls -la
          version=$(node -p "require('$GITHUB_WORKSPACE/app/package.json').version")
          f="eu.jumplink.troedler-${version}-1.x86_64.flatpak"
          if [ ! -s "$f" ]; then
            echo "::error::missing or empty artifact: $f"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ship-flatpak
          path: app/ship/out/*.flatpak
          compression-level: 0
